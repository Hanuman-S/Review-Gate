    <title>ReviewGate — confidential peer review</title>
    <!--
      No external fonts, no analytics, no error reporting.
      A single outbound request undermines the entire confidentiality claim.
      Keep this file free of third-party origins.

      ORIGIN TRIAL
      WebMCP is behind a Chrome origin trial. Without a token, visitors must
      enable chrome://flags/#enable-webmcp-testing themselves — which judges
      will not do. With a token, the API is simply available to any Chrome 149+
      visitor.

      Tokens are bound to one exact origin. https://reviewgate.vercel.app and
      https://reviewgate-git-main-you.vercel.app are DIFFERENT origins, so a
      preview deployment will not be covered. Register the production origin,
      paste the token below, and submit that URL.

      Register: https://developer.chrome.com/origintrials
    -->
